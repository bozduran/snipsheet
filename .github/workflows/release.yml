name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, tag and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::Run a version bump from the default branch (${DEFAULT_BRANCH})."
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          npm version "${BUMP}" -m 'chore(release): %s'

          VERSION=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists on origin."
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The version bump left uncommitted changes."
            git status --short
            exit 1
          fi

      - name: Resolve version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [ "${REF_TYPE}" = "tag" ]; then
            if [ "${REF_NAME}" != "v${VERSION}" ]; then
              echo "::error::Tag ${REF_NAME} does not match package.json v${VERSION}."
              exit 1
            fi
            TAG="${REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm run build
          npx --no-install vsce package --no-dependencies --out "snipsheet-${VERSION}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: snipsheet-vsix
          path: '*.vsix'
          if-no-files-found: error

      - name: Push release commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN pushes do not trigger another workflow run, so this
          # same run creates the release below.
          git push --atomic origin "HEAD:${DEFAULT_BRANCH}" "refs/tags/${TAG}"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" ./*.vsix --verify-tag --generate-notes --title "SnipSheet ${TAG}"
