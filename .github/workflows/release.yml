name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  open-pr:
    name: Open release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run audit
          npm run lint
          npm run typecheck
          npm test

      - name: Open release PR
        env:
          BUMP: ${{ inputs.bump }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::Run the release workflow from the default branch (${DEFAULT_BRANCH})."
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          npm version "${BUMP}" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          BRANCH="release/v${VERSION}"
          TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists on origin."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "::error::Branch ${BRANCH} already exists on origin."
            exit 1
          fi

          git checkout -b "${BRANCH}"
          git add package.json package-lock.json
          git commit -m "chore(release): ${TAG}"
          git push origin "${BRANCH}"

          gh pr create \
            --base "${DEFAULT_BRANCH}" \
            --head "${BRANCH}" \
            --title "chore(release): ${TAG}" \
            --body "Automated release PR for ${TAG}. Merge this PR to publish. The Publish release workflow tags the merge commit, builds the VSIX and SHA256SUMS, and creates the GitHub Release. Keep 'chore(release):' in the PR title and merge commit message so the publish workflow recognises the release."

          echo "Opened release PR for ${TAG}."
